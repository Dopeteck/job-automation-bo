name: Run Job Automation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-telegram-bot==13.7
          pip install google-api-python-client google-auth google-auth-oauthlib beautifulsoup4 feedparser requests

      # 4️⃣ Restore Blogger token
      - name: Restore Blogger token
        run: |
          echo "${{ secrets.BLOGGER_TOKEN_B64 }}" | base64 --decode > token_blogger.pkl

      # 🟡 Manual scrape (workflow_dispatch)
      - name: Manual scrape
        if: github.event_name == 'workflow_dispatch'
        run: python job_scraper.py

      # 🟢 Scheduled scrape
      - name: Compute category
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(date -u +"%H")
          # Adjust categories based on hour
          if [ "$HOUR" -eq 12 ]; then echo "tech,web3,crypto" > cat.txt; fi
          if [ "$HOUR" -eq 16 ]; then echo "tech,web3,crypto" > cat.txt; fi
          if [ "$HOUR" -eq 20 ]; then echo "tech,web3,crypto" > cat.txt; fi

      - name: Run scraper
        if: github.event_name == 'schedule'
        run: |
          export CATEGORY=$(cat cat.txt)
          python job_scraper.py

      # 🧠 Commit all job tracking files
      - name: Commit job tracking files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.json token_blogger.pkl
          git commit -m "Update job tracking files" || echo "No changes to commit"
          git push

      # 🔵 & 🟢 Publish jobs (Telegram + Blogger)
      - name: Publish Jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
        run: python publishers/unified_publisher.py
