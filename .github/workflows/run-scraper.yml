name: Weekly Digest

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday (08:00 UTC)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1️⃣ Checkout repo
      # -------------------------
      - uses: actions/checkout@v3

      # -------------------------
      # 2️⃣ Python setup
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # -------------------------
      # 3️⃣ Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai
          pip install google-api-python-client google-auth google-auth-oauthlib

      # -------------------------
      # 4️⃣ Restore Blogger token
      # -------------------------
      - name: Restore Blogger token
        run: |
          echo "${{ secrets.BLOGGER_TOKEN_B64 }}" | base64 --decode > token_blogger.pkl

      # -------------------------
      # 5️⃣ Run weekly digest
      # -------------------------
      - name: Run weekly digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
        run: |
          python weekly_digest.py








